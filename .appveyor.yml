# AU template: https://github.com/chocolatey-community/chocolatey-au-packages-template

version: '{build}'
pull_requests:
  do_not_increment_build_number: true
max_jobs: 1
# Chocolatey CLI 2.x is required: the community repository rejects non-normalized versions
# (e.g. 4.1.0.0 instead of 4.1.0) that Chocolatey 0.10.x produces. It needs .NET 4.8.
image: Visual Studio 2022
# History plugin requires complete log
#clone_depth: 5
branches:
  only:
  - develop
skip_tags: true
skip_branch_with_pr: true
#build:
#  verbosity: minimal

environment:
  au_push: true
  # Force test: use 1 to test all, or N to split testing into N groups
  au_test_groups: 1

  # Github token to commit pushed packages to repository
  github_user_repo: Xav83/chocolatey-packages
  github_api_key:
    secure: LjfwT10fEcZ6f5XaJhGvjeHiYWj/WhUzNZZMskOUrF+fV4yaCWvIJkwNbzVR8Jci #https://ci.appveyor.com/tools/encrypt

  # Mail credentials - for error notifications
  mail_user:
    secure: 2QYTLplN8XL9levuMol3EUEijjyfkSXKfoPmoIFqPlM #https://ci.appveyor.com/tools/encrypt
  mail_pass:
    secure: #https://ci.appveyor.com/tools/encrypt
  mail_server: smtp.gmail.com
  mail_port: 587
  mail_enablessl: true

  # ID of the gist used to save run results - create a gist under the github_user (secret or not) and grab the id - https://gist.github.com/name/id
  # Optional, leave empty to create anonymous gist
  gist_id: c4eb33a8aa993629f3d047747322e809

  # Force test: gist id for test results
  gist_id_test: c4eb33a8aa993629f3d047747322e809

  # Chocolatey API key - to push updated packages
  api_key:
    secure: KFn01PhupUymxo8Q5SyiT713EG/Btb7vZ6M2pXvzNFv7BG+drdTyhrtxMjKXb0Tf

init:
- git config --global user.email "chocolatey@realdimensions.net"
- git config --global user.name "Chocolatey"
- git config --global core.safecrlf false

install:
- ps: 'Get-CimInstance win32_operatingsystem -Property Caption, OSArchitecture, Version | fl Caption, OSArchitecture, Version'
- ps: $PSVersionTable
- git --version
- ps: choco upgrade chocolatey -y --no-progress
- ps: choco --version
# Install the released chocolatey-au module (building it from source fails on this image:
# GitVersion "HEAD has moved after repo normalisation").
- ps: choco install chocolatey-au -y --no-progress

- ps: |
    "Build info"
    '  {0,-20} {1}' -f 'SCHEDULED BUILD:', ($Env:APPVEYOR_SCHEDULED_BUILD -eq 'true')
    '  {0,-20} {1}' -f 'FORCED BUILD:'   , ($Env:APPVEYOR_FORCED_BUILD    -eq 'true')
    '  {0,-20} {1}' -f 'RE BUILD:'       , ($Env:APPVEYOR_RE_BUILD        -eq 'true')

build_script:
- ps: |
    $ErrorActionPreference = 'Continue'

    if ($Env:APPVEYOR_PROJECT_NAME  -like '*test*') { ./test_all.ps1 "random $Env:au_test_groups"; return }

    if ( ($Env:APPVEYOR_SCHEDULED_BUILD -ne 'true') -and ($Env:APPVEYOR_FORCED_BUILD -ne 'true') ) {
        switch -regex ($Env:APPVEYOR_REPO_COMMIT_MESSAGE)
        {
            '\[AU (.+?)\]'   { $forced = $Matches[1] }

            '\[PUSH (.+?)\]' {
                $packages = $Matches[1] -split ' '
                Write-Host "PUSHING PACKAGES: $packages"
                foreach ($package in $packages) {
                    Write-Host ("{0}`n{1}`n" -f ('-'*60), "PACKAGE: $package")
                    $package_dir = ls -recurse | ? { $_.Name -eq "$package.nuspec"} | select -First 1 | % Directory
                    if (!$package_dir) { Write-Warning "Can't find package '$package'"; continue }
                    pushd $package_dir; choco pack; Push-Package; popd
                }
                return
            }
        }
    }

    ./update_all.ps1 -ForcedPackages $forced
    7z a au_temp.zip $Env:TEMP\chocolatey\au\*

artifacts:
- path: update_info.xml
- path: Update-AUPackages.md
- path: au_temp.zip

notifications:
- provider: Email
  to: $(mail_user)
  on_build_success: false
  on_build_failure: true
  on_build_status_changed: true

#on_finish:
#- ps: $blockRdp = $true; iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/appveyor/ci/master/scripts/enable-rdp.ps1'))

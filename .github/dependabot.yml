# Keeps the actions used in .github/workflows up to date: Dependabot opens a pull request
# when a new version of an action is released (e.g. actions/checkout v4 -> v5).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # One pull request for all action updates of the week, instead of one per action.
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

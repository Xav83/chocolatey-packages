# Keeps dependencies up to date: Dependabot opens a pull request when a new version is released
# - the actions used in .github/workflows (e.g. actions/checkout v4 -> v5)
# - the Python packages pinned in requirements.txt (black, ruff, codespell, zizmor, twitter-api-client)
# - the actionlint Docker image pinned in .github/actionlint/Dockerfile
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # One pull request for all action updates of the week, instead of one per action.
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # One pull request for the dev tools; twitter-api-client gets its own, as an update
    # could change how the tweet script talks to X.
    groups:
      python-tools:
        patterns: ['black', 'ruff', 'codespell', 'zizmor']
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /.github/actionlint
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci

# Checks that the URLs in the package nuspecs (icon, project, license, docs, bug tracker, sources,
# release notes...) are still valid. AU itself runs on AppVeyor; this workflow only checks links.
name: Check package URLs

on:
  push:
    branches: [develop]
    paths: ['automatic/**/*.nuspec', '.github/workflows/check-urls.yml']
  pull_request:
    paths: ['automatic/**/*.nuspec', '.github/workflows/check-urls.yml']
  schedule:
    - cron: '21 4 * * 1'   # every Monday, 04:21 UTC: catches links that die upstream
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Strip XML comments (template leftovers, disabled iconUrl lines...) so that only the
      # metadata Chocolatey actually uses gets checked. One copy per package keeps the
      # package name in the report.
      - name: Extract nuspec metadata
        run: |
          mkdir -p _linkcheck
          python3 - <<'PY'
          import glob, os, re
          for path in glob.glob('automatic/*/*.nuspec'):
              text = open(path, encoding='utf-8-sig').read()
              text = re.sub(r'<!--.*?-->', '', text, flags=re.S)
              name = os.path.basename(os.path.dirname(path))
              open(f'_linkcheck/{name}.nuspec.txt', 'w', encoding='utf-8').write(text)
          PY

      - name: Check URLs
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 3
            --timeout 30
            --accept '100..=103,200..=299,429'
            --exclude 'schemas\.microsoft\.com/packaging'
            '_linkcheck/*.nuspec.txt'
          fail: true
          format: markdown
          output: lychee-report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On the weekly run, keep a single issue (label 'broken-links') in sync with the results:
      # it is opened on the first failure, updated on the next ones, and closed once all URLs pass.
      - name: Sync the broken-links issue
        if: always() && github.event_name == 'schedule' && steps.lychee.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINKS_OK: ${{ steps.lychee.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const label = 'broken-links';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, labels: label, state: 'open', per_page: 1,
            });
            const issue = open[0];

            if (process.env.LINKS_OK === 'true') {
              if (issue) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number,
                  body: `All URLs are valid again (${run}).`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            // GitHub limits an issue body to 65536 characters.
            let body = fs.existsSync('lychee-report.md') ? fs.readFileSync('lychee-report.md', 'utf8') : 'No report generated.';
            body = `Weekly link check: ${run}\n\n${body}`.slice(0, 65000);

            if (issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'Broken URLs in package nuspecs', body, labels: [label],
              });
            }

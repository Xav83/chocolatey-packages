# Static checks of the repository's scripts. AU itself runs on AppVeyor.
name: Lint

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Get-Module -ListAvailable -Name PSScriptAnalyzer | Select-Object Name, Version

      - name: Analyze scripts
        shell: pwsh
        run: |
          # automatic/_output holds the template's example packages; setup/ketarin_setup.ps1 is unused.
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File |
              Where-Object { $_.FullName -notmatch '[\\/](\.git|_output)[\\/]' -and $_.Name -ne 'ketarin_setup.ps1' }

          $results = $files | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1
          }

          foreach ($r in $results) {
              $path = Resolve-Path -Relative $r.ScriptPath
              $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
              # GitHub annotation: shows the problem on the line in the commit / pull request view
              Write-Output "::${level} file=$path,line=$($r.Line),col=$($r.Column),title=$($r.RuleName)::$($r.Message)"
          }

          Write-Output "$($files.Count) scripts analyzed, $(@($results).Count) problem(s) found."
          if ($results) { exit 1 }

  # Package checks:
  # - nuspecs: required fields, id = folder name, normalized version, packageSourceUrl,
  #   dependencies and files (ops/test_nuspecs.py)
  # - update scripts: every au_SearchReplace pattern matches its target file
  #   (ops/test_package_scripts.py)
  packages:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate nuspecs
        run: python3 ops/test_nuspecs.py
      - name: Check update scripts
        if: always()
        run: python3 ops/test_package_scripts.py

  # Python scripts (scripts/, ops/): formatting with black and linting with ruff (settings in
  # ruff.toml), with the versions pinned in requirements.txt. Locally: make lint / make format.
  python:
    name: Python (black, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pipx (preinstalled on the runners) avoids pip's "externally managed environment" error.
      - name: Install black and ruff
        run: |
          grep -E '^(black|ruff)==' requirements.txt | while read -r package; do pipx install "$package"; done
      - name: black
        run: black --check --diff scripts ops
      - name: ruff
        run: ruff check --output-format github scripts ops

  # Common misspellings in the whole repository (settings in .codespellrc), with the version
  # pinned in requirements.txt. Locally: codespell
  spelling:
    name: Spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install codespell
        run: pipx install "$(grep -E '^codespell==' requirements.txt)"
      - name: codespell
        run: codespell

  # GitHub Actions workflows: syntax, expressions, step outputs, and the shell scripts in 'run:'
  # steps (through shellcheck). Uses the official actionlint Docker image; its version is pinned
  # in .github/actionlint/Dockerfile and kept up to date by Dependabot.
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          docker build --quiet --tag actionlint .github/actionlint
          docker run --rm --volume "$PWD:/repo" --workdir /repo actionlint -color

  # Encoding, line endings, trailing whitespace and final newline, as defined in .editorconfig.
  # Same script as the Git pre-commit hook (.githooks/pre-commit), in check mode.
  format:
    name: Formatting (ops/Format-Files.ps1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        shell: pwsh
        run: ./ops/Format-Files.ps1 -Check
